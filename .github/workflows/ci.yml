name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 组合门禁：typecheck + lint + test + build（红队基线 + 管道回归 + 产物可运行）
      - run: pnpm verify
      - name: dist 产物冒烟
        run: node dist/cli/index.mjs --version

  node18-guard:
    name: node18 守卫（红队 S1）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: bin 入口应人话报错且 exit 2
        run: |
          set +e
          output=$(node bin/skyport.mjs doctor 2>&1)
          code=$?
          set -e
          echo "$output"
          echo "$output" | grep -q "版本过低"
          test "$code" -eq 2
